        'POST /chat/session':
          ThrottlingBurstLimit: 2
          ThrottlingRateLimit: 0.5

  ChatEdgeFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-chat-edge'
      AutoPublish: true
      FunctionConfig:
        Comment: Reject unsupported chat requests before they reach API Gateway.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var origin = request.headers.origin ? request.headers.origin.value : '';
          var allowedOrigins = ['https://${DomainName}', 'https://www.${DomainName}',
            'https://${GitHubBranch}.${PortfolioApp.DefaultDomain}'];
          var headers = {'cache-control': {value: 'no-store'}};
          if (allowedOrigins.indexOf(origin) >= 0) {
            headers['access-control-allow-origin'] = {value: origin};
          }
          if (['/chat', '/chat/session', '/chat/session/upgrade'].indexOf(request.uri) < 0) return {statusCode: 404, headers: headers};
          if (request.method !== 'POST' && request.method !== 'OPTIONS') {
            return {statusCode: 405, headers: headers};
          }
          if (allowedOrigins.indexOf(origin) < 0) return {statusCode: 403, headers: headers};
          if (request.method === 'POST' && request.uri !== '/chat/session' && (!request.headers.authorization ||
              !/^Bearer\s+\S+$/.test(request.headers.authorization.value))) {
            return {statusCode: 401, headers: headers};
          }
          request.headers['x-portfolio-viewer-ip'] = {value: event.viewer.ip};
          return request;
        }

  ChatCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-chat-no-cache'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  ChatOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-chat-origin'
        CookiesConfig:
          CookieBehavior: none
        HeadersConfig:
          HeaderBehavior: allExcept
          Headers: [host]
        QueryStringsConfig:
          QueryStringBehavior: none

  ChatDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        IPV6Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: ChatApiOrigin
            DomainName: !Sub '${ChatApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: X-Portfolio-Origin
                HeaderValue: !Sub '{{resolve:secretsmanager:${ChatOriginSecret}:SecretString:token}}'
        DefaultCacheBehavior:
          TargetOriginId: ChatApiOrigin
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: !Ref ChatCachePolicy
          OriginRequestPolicyId: !Ref ChatOriginRequestPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ChatEdgeFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ErrorCachingMinTTL: 0
          - ErrorCode: 500
            ErrorCachingMinTTL: 0
          - ErrorCode: 502
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
          - ErrorCode: 504
            ErrorCachingMinTTL: 0

  ChatPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ChatFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ChatApi}/*/POST/chat'

Outputs:
  ChatNotificationTopicArn:
    Condition: EnableChatNotifications
    Value: !Ref ChatNotificationTopic
  ChatNotificationFailureQueueURL:
    Condition: EnableChatNotifications
    Value: !Ref ChatNotificationFailureQueue
  ChatGuardrailId:
    Value: !GetAtt ChatGuardrail.GuardrailId
  ChatGuardrailVersion:
    Value: !GetAtt ChatGuardrailVersion.Version
  ChatAuthenticationDomain:
    Value: !Sub 'https://${ChatUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  SocialIdentityCallbackURL:
    Value: !Sub 'https://${ChatUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse'
  ChatAuthenticationClientId:
    Value: !Ref ChatUserPoolClient
  ChatApiURL:
    Value: !Sub 'https://${ChatDistribution.DomainName}/chat'
  CvSourceBucket:
    Value: !Ref CvBucket
  CvKnowledgeBaseId:
    Value: !Ref CvKnowledgeBase
  AmplifyAppId:
    Description: Amplify app ID.
    Value: !GetAtt PortfolioApp.AppId

  AmplifyDefaultDomain:
    Description: Default Amplify domain (without branch prefix).
    Value: !GetAtt PortfolioApp.DefaultDomain

  WebsiteURL:
    Description: Amplify URL, available once main is deployed.
    Value: !Sub
      - 'https://${Branch}.${Domain}'
      - Branch: !Ref GitHubBranch
        Domain: !GetAtt PortfolioApp.DefaultDomain

  HostedZoneId:
    Description: Route 53 public hosted zone ID.
    Value: !Ref PublicHostedZone

  DomainName:
    Description: DNS domain configured for the hosted zone.
    Value: !Ref DomainName

  Route53NameServers:
    Description: Copy these four name servers to the domain registrar.
    Value: !Join [', ', !GetAtt PublicHostedZone.NameServers]

  CustomDomainURL:
    Condition: UseCustomDomain
    Description: Custom HTTPS URL, valid once Amplify domain verification completes.
    Value: !Sub 'https://${DomainName}'
